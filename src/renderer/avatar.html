<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <!-- CSP 는 main 의 src/main/csp.ts 에서 헤더로 준다. 개발과 배포에서 정책이 달라야 해서
         한 곳에서만 정한다. 여기에 meta 태그를 추가하면 두 정책이 겹쳐 헷갈린다. -->
    <!-- 프레임이 없어 화면에 뜨지 않지만, 작업 관리자에는 이 이름으로 보인다. -->
    <title>waifu-agent</title>
    <style>
      /* 창 자체가 투명하므로 문서 전체가 배경 없이 비어 있어야 한다.
         어느 한 곳에라도 불투명 배경을 주면 그 사각형이 그대로 화면에 뜬다. */
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
        /* 오버레이에서 텍스트 선택 커서가 뜨면 어색하다. */
        user-select: none;
        cursor: default;
      }
      #avatar-canvas {
        display: block;
        width: 100%;
        height: 100%;
        background: transparent;
      }
      /* 자막은 캔버스 위에 겹친다. pointer-events:none 이 없으면 이 사각형이
         알파 히트테스트를 우회해 클릭을 먹어버린다. */
      #subtitle {
        position: absolute;
        left: 8px;
        right: 8px;
        bottom: 12px;
        pointer-events: none;
        padding: 10px 14px;
        border-radius: 12px;
        background: rgba(20, 19, 26, 0.86);
        color: #f0eef8;
        font-family: 'Pretendard', 'Segoe UI', system-ui, sans-serif;
        font-size: 14px;
        line-height: 1.5;
        white-space: pre-wrap;
        opacity: 0;
        transition: opacity 0.18s ease;
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.6);
      }
      #subtitle.on {
        opacity: 1;
      }
      /* 상태 점. 작업 중인지 한눈에 보이게 한다. */
      #status {
        position: absolute;
        top: 10px;
        right: 10px;
        width: 9px;
        height: 9px;
        border-radius: 50%;
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.2s ease, background 0.2s ease;
      }
      #status.on {
        opacity: 1;
      }
    </style>
  </head>
  <body>
    <canvas id="avatar-canvas"></canvas>
    <div id="status"></div>
    <div id="subtitle"></div>
    <script type="module" src="./avatar/main.ts"></script>
  </body>
</html>
